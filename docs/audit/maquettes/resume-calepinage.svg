<svg xmlns="http://www.w3.org/2000/svg" width="390" height="210" viewBox="0 0 390 210" font-family="Inter, system-ui, sans-serif">
  <title>Maquette — résumé du calepinage en deux parties (UX-01)</title>
  <rect width="390" height="210" fill="#FAF1E9"/>
  <rect x="0" y="20" width="390" height="190" rx="16" fill="#FFFFFF" stroke="#C9D3CE"/>
  <rect x="171" y="30" width="48" height="5" rx="2.5" fill="#5C6666"/>
  <text x="16" y="62" font-size="12" fill="#5C6666">CETTE POSE · Salle de bain, sol · 6,7 m²</text>
  <text x="16" y="88" font-size="20" font-weight="700" fill="#252D2D" font-family="Manrope, system-ui, sans-serif">347 carreaux posés · 51 coupes</text>
  <text x="16" y="108" font-size="14" fill="#5C6666">dont 25 dans les chutes · 0 coupe fine</text>
  <line x1="16" y1="124" x2="374" y2="124" stroke="#C9D3CE"/>
  <text x="16" y="146" font-size="12" fill="#5C6666">À COMMANDER (TOUT LE PROJET, CARREAU 20 × 10)</text>
  <text x="16" y="170" font-size="18" font-weight="700" fill="#252D2D" font-family="Manrope, system-ui, sans-serif">47 cartons · 585,15 €</text>
  <text x="16" y="192" font-size="13" fill="#174F50" text-decoration="underline">Voir les achats ›</text>
  <text x="250" y="192" font-size="13" fill="#174F50" text-decoration="underline">Résultats ›</text>
</svg>
